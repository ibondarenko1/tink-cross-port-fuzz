name: Tink compatibility report
description: Check Tink dependency upgrades and rollout order with signed public test fixtures
author: Ievgen Bondarenko
inputs:
  mode:
    description: "project compares PR commits, sample runs the bundled reference, profile uses an explicit file"
    default: auto
  profile:
    description: Path to an explicit profile in the checked-out workspace
    default: ''
  python-lock:
    description: Exact Python dependency file relative to both project checkouts
    default: ''
  go-module:
    description: Go module directory relative to both project checkouts
    default: ''
  go-list:
    description: Project-relative path to a resolved go list -m -json all export
    default: ''
  java-dependencies:
    description: Project-relative path to a resolved Maven dependency list
    default: ''
  out:
    description: Output directory in the consumer workspace
    default: compatibility-report
  offline:
    description: Use cached modules and prepared adapters
    default: 'false'
outputs:
  report-json:
    description: Path to report.json
    value: ${{ steps.run.outputs.report-json }}
  report-md:
    description: Path to report.md
    value: ${{ steps.run.outputs.report-md }}
  status:
    description: PASS, FAIL or INCOMPLETE
    value: ${{ steps.run.outputs.status }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Identify inputs and checker revision
      id: begin
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        MODE: ${{ inputs.mode }}
        PROFILE: ${{ inputs.profile }}
        PYTHON_LOCK: ${{ inputs.python-lock }}
        GO_MODULE: ${{ inputs.go-module }}
        GO_LIST: ${{ inputs.go-list }}
        JAVA_DEPENDENCIES: ${{ inputs.java-dependencies }}
        OFFLINE: ${{ inputs.offline }}
        REPORT_DIR: ${{ inputs.out }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: python -I "$ACTION_PATH/tools/action_run.py" begin
    - name: Check out the PR base commit
      if: steps.begin.outputs.mode == 'project'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.event.pull_request.base.repo.full_name }}
        ref: ${{ github.event.pull_request.base.sha }}
        path: ${{ steps.begin.outputs.trees }}/base
        persist-credentials: false
        fetch-depth: 1
    - name: Check out the PR head commit
      if: steps.begin.outputs.mode == 'project'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        path: ${{ steps.begin.outputs.trees }}/head
        persist-credentials: false
        fetch-depth: 1
    - name: Read required languages
      id: languages
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PLAN_DIR: ${{ steps.begin.outputs.plan-dir }}
      run: python -I "$ACTION_PATH/tools/action_run.py" languages
    - name: Set up Go
      if: steps.languages.outputs.go == 'true'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.25.11'
        cache: false
    - name: Set up Java
      if: steps.languages.outputs.java == 'true'
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Resolve both dependency sets
      id: resolve
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PLAN_DIR: ${{ steps.begin.outputs.plan-dir }}
      run: python -I "$ACTION_PATH/tools/action_run.py" resolve
    - name: Cache python adapter 1
      if: steps.resolve.outputs.python0-key != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ steps.resolve.outputs.python0-key }}
        path: ${{ steps.resolve.outputs.python0-path }}
    - name: Cache python adapter 2
      if: steps.resolve.outputs.python1-key != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ steps.resolve.outputs.python1-key }}
        path: ${{ steps.resolve.outputs.python1-path }}
    - name: Cache go adapter 1
      if: steps.resolve.outputs.go0-key != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ steps.resolve.outputs.go0-key }}
        path: ${{ steps.resolve.outputs.go0-path }}
    - name: Cache go adapter 2
      if: steps.resolve.outputs.go1-key != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ steps.resolve.outputs.go1-key }}
        path: ${{ steps.resolve.outputs.go1-path }}
    - name: Cache java adapter 1
      if: steps.resolve.outputs.java0-key != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ steps.resolve.outputs.java0-key }}
        path: ${{ steps.resolve.outputs.java0-path }}
    - name: Cache java adapter 2
      if: steps.resolve.outputs.java1-key != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ steps.resolve.outputs.java1-key }}
        path: ${{ steps.resolve.outputs.java1-path }}
    - name: Run compatibility checks and write the PR summary
      id: run
      if: always() && steps.begin.outputs.plan-dir != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PLAN_DIR: ${{ steps.begin.outputs.plan-dir }}
        PRIOR_STATUS: ${{ job.status }}
      run: python -I "$ACTION_PATH/tools/action_run.py" run
