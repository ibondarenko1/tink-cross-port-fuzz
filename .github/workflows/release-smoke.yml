name: Released action and wheel

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  action-consumer:
    runs-on: ubuntu-24.04
    steps:
      - name: Run the external tagged action
        id: matrix
        uses: ibondarenko1/tink-cross-port-fuzz@v0.2.0
        with:
          mode: sample
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          path: source
          persist-credentials: false
      - name: Match public outputs and the tag revision
        env:
          REPORT: ${{ steps.matrix.outputs.report-json }}
          MARKDOWN: ${{ steps.matrix.outputs.report-md }}
          VERDICT: ${{ steps.matrix.outputs.status }}
        run: |
          test "$VERDICT" = PASS && test -s "$MARKDOWN"
          python source/tools/release_contract.py --tag "$TAG" --report "$REPORT" --revision "$(git -C source rev-parse HEAD)"

  wheel-consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
          cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the tagged distribution before publishing
        if: github.event_name == 'push'
        run: |
          python -m pip install 'build==1.3.0'
          python -m build --outdir "$RUNNER_TEMP/downloads"
      - name: Fetch and verify the publicly downloadable wheel
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/downloads" --pattern '*.whl' --pattern SHA256SUMS.txt
          (cd "$RUNNER_TEMP/downloads" && sha256sum --check --strict --ignore-missing SHA256SUMS.txt)
      - name: Install the wheel and test it outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install --no-deps "$RUNNER_TEMP/downloads/"*.whl
          mkdir "$RUNNER_TEMP/empty"
          cd "$RUNNER_TEMP/empty"
          "$RUNNER_TEMP/consumer/bin/tink-compat" check --out report
          python "$GITHUB_WORKSPACE/tools/release_contract.py" --tag "$TAG" --report report/report.json --revision "tink-release-compat@${TAG#v}"
