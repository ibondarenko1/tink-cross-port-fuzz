name: Publish release report

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Render latest and versioned reports from release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          tags="$RUNNER_TEMP/versions"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false and any(.assets[]; .name == "report.json")) | .tag_name' > "$tags"
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            assets="$RUNNER_TEMP/releases/$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$assets" \
              --pattern report.json --pattern report.md --pattern SHA256SUMS.txt
            args=(--artifacts "$assets" --tag "$tag" --revision "$revision" --versions "$tags")
            python tools/render_site.py "${args[@]}" --permalink --out "$RUNNER_TEMP/pages/$tag"
            if [[ "$tag" = "$latest" ]]; then
              python tools/render_site.py "${args[@]}" --out "$RUNNER_TEMP/pages"
            fi
          done < "$tags"
          test -s "$RUNNER_TEMP/pages/index.html"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
