name: Compatibility matrix

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/tink-compat
          key: tink-compat-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tink_compat/**', 'runners/**', 'pyproject.toml') }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.4'
          cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run unit tests
        run: |
          python -m pip install --disable-pip-version-check --no-input 'pytest==9.2.0'
          python -m pytest -q
      - name: Run compatibility matrix
        id: compatibility
        continue-on-error: true
        run: python -m tink_compat check --profile tink_compat/data/profile.json --out compatibility-report --cache .cache/tink-compat --revision "$GITHUB_SHA"
      - name: Add compatibility report to step summary
        if: always()
        run: |
          if [ -f compatibility-report/report.md ]; then
            cat compatibility-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-report
          path: |
            compatibility-report/report.json
            compatibility-report/report.md
          if-no-files-found: error
      - name: Enforce matrix result
        if: steps.compatibility.outcome == 'failure'
        run: exit 1

  package:
    needs: compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-report
          path: ${{ runner.temp }}/measured
      - name: Build wheel from the source distribution and verify the release files
        run: |
          python -m pip install 'build==1.3.0'
          python -m build --outdir "$RUNNER_TEMP/dist"
          python tools/package_release.py --dist "$RUNNER_TEMP/dist" --report "$RUNNER_TEMP/measured" \
            --out "$RUNNER_TEMP/downloads" --revision "$GITHUB_SHA"
          python tools/render_site.py --artifacts "$RUNNER_TEMP/downloads" --tag "v$(python -c 'import tink_compat; print(tink_compat.__version__)')" \
            --revision "$GITHUB_SHA" --out "$RUNNER_TEMP/site"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/downloads/
          if-no-files-found: error
