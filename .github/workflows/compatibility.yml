name: Compatibility matrix

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test the checker and project resolver
        run: |
          python -m pip install 'pytest==9.2.0'
          python -m pytest -q
          python tools/release_contract.py --tag "v$(python -c 'import tink_compat; print(tink_compat.__version__)')"
      - name: Measure the release reference
        id: matrix
        uses: ./
        with:
          mode: sample
      - name: Save measured report
        if: always() && steps.matrix.outputs.report-json != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-report
          path: |
            compatibility-report/report.json
            compatibility-report/report.md
          if-no-files-found: error

  package:
    needs: compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-report
          path: ${{ runner.temp }}/measured
      - name: Build wheel from sdist and verify against the measured source
        run: |
          python -m pip install 'build==1.3.0'
          python -m build --outdir "$RUNNER_TEMP/dist"
          python tools/package_release.py --dist "$RUNNER_TEMP/dist" --report "$RUNNER_TEMP/measured" \
            --out "$RUNNER_TEMP/downloads" --revision "$GITHUB_SHA"
          python tools/render_site.py --artifacts "$RUNNER_TEMP/downloads" --tag "v$(python -c 'import tink_compat; print(tink_compat.__version__)')" \
            --revision "$GITHUB_SHA" --out "$RUNNER_TEMP/site"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/downloads/
          if-no-files-found: error
