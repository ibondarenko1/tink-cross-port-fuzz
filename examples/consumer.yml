name: Tink dependency upgrade

on: pull_request

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Compare the PR base and head
        id: tink
        uses: ibondarenko1/tink-cross-port-fuzz@v0.2.0
        with:
          python-lock: requirements.txt
          go-module: .
      - name: Save the full report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tink-upgrade-report
          path: |
            ${{ steps.tink.outputs.report-json }}
            ${{ steps.tink.outputs.report-md }}
          if-no-files-found: error
